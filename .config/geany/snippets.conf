# Geany snippets — type the keyword, press Tab to expand.
# %cursor% marks where the caret lands. Snippets with more than one
# stop: Ctrl+Return jumps to the next one ("Move cursor in snippet").
# \t expands to whatever the current indent setting is.

# [Default] works in ANY buffer, including brand-new unsaved ones —
# so the header snippet fires before the file is even saved as .sh
[Default]
bash=#!/usr/bin/env bash\n# DESC: %cursor%\n\nset -euo pipefail\n\n

[Sh]
bash=#!/usr/bin/env bash\n# DESC: %cursor%\n\nset -euo pipefail\n\n
fn=%cursor%() {\n\t%cursor%\n}\n
if=if [[ %cursor% ]]; then\n\t%cursor%\nfi\n
ife=if [[ %cursor% ]]; then\n\t%cursor%\nelse\n\t%cursor%\nfi\n
for=for f in %cursor%; do\n\t%cursor%\ndone\n
while=while %cursor%; do\n\t%cursor%\ndone\n
case=case "%cursor%" in\n\t%cursor%)\n\t\t%cursor%\n\t\t;;\n\t*)\n\t\t;;\nesac\n
die=die() {\n\techo "Error: $*" >&2\n\texit 1\n}\n
here=cat <<EOF\n%cursor%\nEOF\n
