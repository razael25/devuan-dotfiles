# QML — Qt's interface language, and what the quickshell bar is written in.
# Geany has no QML lexer. QML is JavaScript inside a declarative shell, so
# this borrows the JavaScript lexer and adds QML's own words; that gets
# colouring, folding and comment toggling for .qml files.
# The extension is mapped in ../filetype_extensions.conf.
[styling=C]

[keywords]
# JavaScript's, then QML's declarations
primary=break case catch class const continue debugger default delete do else enum export extends false finally for function get if import in Infinity instanceof let NaN new null return set static super switch this throw true try typeof undefined var void while with yield async await from as property signal readonly required alias pragma component on
# QML's value types, then the JavaScript globals
secondary=bool int real double string url color date variant list point size rect font vector2d vector3d vector4d quaternion matrix4x4 Array Boolean Date Function Math Number Object String RegExp Error JSON Qt console parseFloat parseInt isNaN isFinite

[lexer_properties=C]
lexer.cpp.backquoted.strings=1

[settings]
lexer_filetype=Javascript
tag_parser=Javascript
extension=qml
comment_single=//
comment_open=/*
comment_close=*/
comment_use_indent=true

[indentation]
