# Language servers in Geany: completion, errors as you type, go to definition.
#
# Only the settings that differ from the plugin's defaults live here (the full
# list, and the command for each language, is in
# /usr/share/geany-plugins/lsp/lsp.conf — Tools > LSP Client shows it).
#
# Nothing happens for a language until its server is installed and on your
# PATH; without one Geany behaves exactly as before, with no errors. With mise:
#     mise use -g zig zls          mise use -g rust rust-analyzer
[all]
# on for every file, not only inside a Geany project that opts in
enable_by_default=true
use_without_project=true
use_outside_project_dir=true
# no extra "LSP Symbols" sidebar tab: it would sit empty for most files and
# push the tree browser aside
document_symbols_tab_label=
